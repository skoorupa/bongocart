<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BongoCart</title>
  <link rel="stylesheet" href="style.css">
  <!-- Three.js z CDN — bez bundlera, działa na hostingu statycznym. -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <canvas id="game"></canvas>

  <div id="hud">
    <div id="speedo"><span id="speed">0</span><small>km/h</small></div>
    <div id="help">
      <b>W/↑</b> gaz · <b>S/↓</b> hamulec · <b>A D</b> skręt · <b>Spacja</b> dryf ·
      <b>C</b> do tyłu · <b>R</b> na tor · <b>Esc</b> ustawienia
    </div>
  </div>

  <aside id="panel" hidden>
    <h1>BongoCart <small>ustawienia toru · etap 2</small></h1>
    <div id="settings"></div>
    <div class="buttons">
      <button id="newTrack">🎲 Nowy losowy tor</button>
      <button id="pinSeed" title="Wpisz bieżący seed do ustawień, żeby powtórzyć ten tor">📌 Przypnij seed</button>
    </div>
    <label class="toggle"><input type="checkbox" id="showDebug"> Linia jazdy botów, checkpointy, pola startowe</label>
    <p class="hint" id="seedLabel"></p>
    <button id="resume" class="wide">▶ Jedź (Esc)</button>
  </aside>

  <canvas id="minimap"></canvas>

  <script type="module" src="src/main.js"></script>
</body>
</html>
